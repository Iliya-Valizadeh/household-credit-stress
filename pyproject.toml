[project]
name = "household-credit-stress"
version = "0.1.0"
description = "A stress test for Canadian household mortgage debt that refreshes from public data each month and grades its own arrears forecasts in the open."
readme = "README.md"
license = "MIT"
authors = [{ name = "Iliya Valizadeh" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "textstat>=0.7.4",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_credit_stress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=household_credit_stress --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
# tools/ is copied from ds-project-standard and checked there. `copier update` replaces it.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
